services:
  - type: web
    name: my-watermark-remover-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://shanpalia.github.io
